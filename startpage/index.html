<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👋 Hi.</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
	<div class="search-box">
		<input id="searchInput" type="text" placeholder="Type 's' or '/' to start typing..."/>
	</div>

	<script>
		document.addEventListener("keyup", (e) => {
			if(e.key == "s" || e.key == '/') searchInput.focus();
		});
		searchInput.addEventListener("keydown", (e) => {
			if(e.key == "Escape") searchInput.blur();
			else if(e.key == "Enter") {
				const a = document.createElement('a');
				a.href = `https://duckduckgo.com/?q=${encodeURI(searchInput.value)}`
				searchInput.value = "";
				a.click();
			}
		})
	</script>	
</body>

</html>
